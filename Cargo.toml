[package]
name = "oplocks"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = [
    "fs",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
] }

windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
