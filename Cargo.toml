[package]
name = "tokio-oplock"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Safe async Windows oplock abstractions for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/amit-zimbalist/tokio-oplock"
keywords = ["windows", "oplock", "iocp", "async", "filesystem"]
categories = ["os::windows-apis", "asynchronous"]
exclude = ["oplocks.code-workspace"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

[target.'cfg(windows)'.dependencies]
bitflags = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tokio = { version = "1", features = [
    "fs",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
] }
